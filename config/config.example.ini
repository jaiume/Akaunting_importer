; Copy to config.ini and adjust for your environment.

[app]
name = "Akaunting Importer"
version = "1.0.0"
debug = false
timezone = "UTC"
; If HTTPS termination hides X-Forwarded-Proto, set true so email magic links and base_url use https://
force_https_urls = false

[database]
host = "localhost"
dbname = "your_database"
username = "your_user"
password = "your_password"
charset = "utf8mb4"

[auth]
token_length = 32
token_expiry = 604800
; Unique per app when multiple products share the parent domain (avoid generic names like auth_token).
cookie_name = akaunting_importer_auth
cookie_path = /
; Optional: exact host, e.g. importer.example.com — leave empty for host-only cookie from the current host.
cookie_domain =

[mail]
smtp_host = "smtp.example.com"
smtp_port = 587
smtp_user = ""
smtp_pass = ""
smtp_encryption = "tls"
from_email = "noreply@example.com"
from_name = "Akaunting Importer"

[paths]
uploads_dir = "public/uploads"

[akaunting]
matching_window_days = 4
api_page_size = 25
api_timeout = 60
api_max_pages = 100

; Remote PDF text extraction (Poppler pdftotext). Must match pdf-extractor config auth.api_key.
; Lab HTTP to Debian test VM: base_url = "http://192.168.11.105" and verify_tls = false
[pdf_extract]
base_url = "https://pdfextractor.example.com"
api_key = "same-secret-as-extractor-config-ini"
timeout = 120
verify_tls = true
; ca_bundle = "/path/to/custom-ca.pem"
